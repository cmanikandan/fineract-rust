[workspace]
resolver = "3"
members = [
    "crates/fineract-schedule-generator",
    "crates/fineract-validation",
    "crates/fineract-command",
    "crates/fineract-events",
    "crates/fineract-report",
    "crates/fineract-rates",
    "crates/fineract-tax",
    "crates/fineract-branch",
    "crates/fineract-charge",
    "crates/fineract-client",
    "crates/fineract-security",
    "crates/fineract-document",
    "crates/fineract-cob",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Apache Fineract Rust Migration"]
repository = "https://github.com/cmanikandan/fineract-rust"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1.12", features = ["v4", "serde"] }
tracing = "0.1"
fineract-schedule-generator = { path = "crates/fineract-schedule-generator" }
fineract-validation = { path = "crates/fineract-validation" }
fineract-command = { path = "crates/fineract-command" }
fineract-events = { path = "crates/fineract-events" }
fineract-report = { path = "crates/fineract-report" }
fineract-rates = { path = "crates/fineract-rates" }
fineract-tax = { path = "crates/fineract-tax" }
fineract-branch = { path = "crates/fineract-branch" }
fineract-charge = { path = "crates/fineract-charge" }
fineract-client = { path = "crates/fineract-client" }
fineract-security = { path = "crates/fineract-security" }
fineract-document = { path = "crates/fineract-document" }
fineract-cob = { path = "crates/fineract-cob" }
