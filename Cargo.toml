[workspace]
resolver = "3"
members = [
    "crates/fineract-validation",
    "crates/fineract-schedule-generator",
    "crates/fineract-command",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Apache Fineract Contributors"]
repository = "https://github.com/apache/fineract"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1.12", features = ["v4", "serde"] }
tracing = "0.1"
